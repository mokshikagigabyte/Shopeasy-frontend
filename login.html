<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ShopEasy - Login/Register</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

  <!-- Login Form -->
  <h2>Login</h2>
  <form id="login-form">
    <label for="login-email">Email:</label><br>
    <input type="email" id="login-email" required><br><br>

    <label for="login-password">Password:</label><br>
    <input type="password" id="login-password" required><br><br>

    <button type="submit">Login</button>
  </form>
  <p>Don't have an account? <a href="#register">Register here</a></p>

  <hr>

  <!-- Register Form -->
  <h2 id="register">Register</h2>
  <form id="register-form">
    <label for="register-username">Username:</label><br>
    <input type="text" id="register-username" required><br><br>

    <label for="register-email">Email:</label><br>
    <input type="email" id="register-email" required><br><br>

    <label for="register-password">Password:</label><br>
    <input type="password" id="register-password" required><br><br>

    <button type="submit">Register</button>
  </form>
  <p>Already have an account? <a href="#login">Login here</a></p>

<script src="script.js"></script>


</body>
</html>
